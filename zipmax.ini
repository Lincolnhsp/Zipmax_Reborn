[ZIPMAX]

work-recursive = 1
skip-internzip = 0
logfile = 0
thread-priority = normal
nobeep = 0
setcurrenttime = 0
showpackerwindow = 0
skipreadonly = 0
skiparchive = 0
setcurrentreadonly = 0

// language of the program: English (default), Portugues-Brasil or auto (= language of Windows).
// The texts are in the "language" folder (language\\<name>.lng); you can add your own language there.
language = English

// optional: full path of 7z.dll (internal zip engine). Default: ZipMax folder, PATH, Program Files
// sevenzip-dll = C:\Program Files\7-Zip\7z.dll

packer-exe-1 = 7za.exe
packer-cmd-1 = a -mpass=4 -mfb=255 -r -y -tzip %1 %2


// add the following to do a 2 pass zipmax

// packer-exe-2 = 7za.exe
// packer-cmd-2 = a -mx -mpass=4 -r -y -tzip %1 %2


// examples for even more external packers

// packer-exe-3 = wzzip.exe
// packer-cmd-3 = -a -ex -rp -whs -ybc %1 %2

// packer-exe-4 = pkzip25.exe
// packer-cmd-4 = -add -max -over=all -path=relative -rec %1 %2

// packer-exe-5 = pkzipc.exe
// packer-cmd-5 = -add -max -over=all -path=relative -rec %1 %2

// packer-exe-6 = pacomp.exe
// packer-cmd-6 = -a -r -p -c2 -w %1 %2

// packer-exe-7 = pkzip.exe
// packer-cmd-7 = -a -ex -rp -whs %1 %2.*

// add the following to run an external program on the zip file each
// packer creates

// finalstep-exe = deflopt.exe
// finalstep-cmd = %1



// more ini information

// packer-cmd is the commandline which is sent to the packer-exe
// %1 = will be filled with the archivename (e.g. c:\temp\test.zip)
// %2 = will always be filled with "*" (all files) (some packers need *.* !!)
//      so you may have to set it to "%2.*"

// Don't forget that your packer shouldn't wait for any keys/yes/no
// inputs. So set an option which will automatically sets e.g. 'yes'
// on all inputs. And you have to add a recursive folder flag. So the
// packer zips all subfolders, too



// nobeep = 0 (default = 0)
// set to "1" when you don't want to hear the beep at the end

// setcurrenttime = 0 (default = 0)
// set to "1" when the created zipfile should get the current date/time
// instead of keeping the original one

// work-recursive = 1 (default = 1)
// set to "1" and when dropping a folder it will go through all
// subfolders recursively

// skip-internzip (default = 0)
// set to "1" to skip the internal zlib smart compress process

// logfile (default = 0)
// set to "1" to generate a logfile (zipmax.log) which logs all events

// thread-priority (default = normal)
// sets the zipping thread priority to normal. other possible values are:
// time_critical, highest, above_normal, normal, below_normal, lowest, idle.


// nobeep (default = 0)
// set it to 1 if you don't want to hear the beep at the end

// setcurrenttime (default = 0)
// set it to 1 if the zipfile should NOT preserve date/timestamps and get the
// current date/time set

// showpackerwindow (default = 0)
// set it to 1 if you want to see the shellwindow of the external packers


// skipreadonly (default = 0)
// set it to 1 if you want files marked read only (R bit set) to be skipped

// skiparchive (default = 0)
// set it to 1 if you want files marked for archive (A bit set) to be skipped

// setcurrentreadonly (default = 0)
// set it to 1 if you want files that are being processed to be set to read only
// Note: files will revert to non-readonly when completed even with 0 byte change

// Use SkipReadOnly, SkipArchive and SetCurrentReadOnly set to 1 in order to
// do a distributed multiple machine process. View the zipmax.txt file for info